name: Build AHuYaGlassLive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      # 现场生成 Wrapper (配合 AGP 9.4.0 使用 Gradle 9.6.0)
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.6.0 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 还原签名文件 (没配 secret 时自动跳过)
      - name: Restore Keystore
        id: keystore_file
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'my-release-key.jks'
          encodedString: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Create keystore.properties
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "storeFile=${{ steps.keystore_file.outputs.filePath }}" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD || '123456' }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS || 'mykey' }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD || '123456' }}" >> keystore.properties

      # 构建 Release APK (因为 gradle 里加了 abiFilters，这里只会产出 arm64 包)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AHuYaGlassLive-arm64-Release
          path: app/build/outputs/apk/release/*.apk
