name: Build AHuYaGlassLive

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ① 还原签名文件（仅当配置了 ANDROID_KEYSTORE secret 时执行）
      - name: Restore Keystore
        id: keystore_file
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'release-key.jks'
          encodedString: ${{ secrets.ANDROID_KEYSTORE }}

      # ② 生成 keystore.properties 供 Gradle 读取
      - name: Create keystore.properties
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "storeFile=${{ steps.keystore_file.outputs.filePath }}" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHuYaGlassLive-Android-Build
          path: app/build/outputs/apk/release/*.apk
